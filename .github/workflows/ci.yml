name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Vet & Race Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: order_dispatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-cmd-interval 10s
          --health-cmd-timeout 5s
          --health-cmd-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/order_dispatch?sslmode=disable
        run: go test -race -v ./...

      - name: Build server binary
        run: go build -v ./cmd/server
